version: '3'

vars:
  GOLANGCI_VERSION: v2.15.0

tasks:
  build:
    desc: Build all packages
    cmds:
      - go build ./...

  tidy:
    desc: Update go.mod and go.sum
    cmds:
      - go mod tidy

  tidy:check:
    desc: Verify go.mod and go.sum are tidy without changing them
    cmds:
      - go mod tidy -diff

  fmt:
    desc: Format Go sources
    cmds:
      - gofmt -w $(find . -type f -name '*.go' -not -path './vendor/*')

  fmt:check:
    desc: Verify Go sources are gofmt-clean
    cmds:
      - test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test:nocache:
    desc: Run all tests without cached results
    cmds:
      - go test -count=1 ./...

  test:race:
    desc: Run race-enabled tests
    cmds:
      - go test -race ./...

  test:race:nocache:
    desc: Run race-enabled tests without cached results
    cmds:
      - go test -race -count=1 ./...

  test:cover:
    desc: Run tests with coverage output
    cmds:
      - go test -coverprofile=coverage.out ./...

  lint:
    desc: Run golangci-lint v2
    cmds:
      - golangci-lint run --timeout=5m

  lint:fix:
    desc: Apply safe golangci-lint fixes
    cmds:
      - golangci-lint run --fix --timeout=5m

  vuln:
    desc: Scan packages and dependencies with govulncheck
    cmds:
      - govulncheck ./...

  cross:windows:
    desc: Cross-compile all packages and tests for Windows/amd64
    cmds:
      - GOOS=windows GOARCH=amd64 go test -exec=true -run='^$' ./...

  tools:
    desc: Install local lint and vulnerability tools
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@latest

  ci:
    desc: Run the complete local CI gate
    cmds:
      - task: tidy:check
      - task: fmt:check
      - task: build
      - task: lint
      - task: test:race:nocache
      - task: cross:windows
      - task: vuln
